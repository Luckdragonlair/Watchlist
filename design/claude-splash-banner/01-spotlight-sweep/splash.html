<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>01 Spotlight sweep · splash preview</title>
<link rel="stylesheet" href="../preview/preview.css">
<link rel="stylesheet" href="splash.css">
</head><body>
<div class="pv-bar">
  <h1>Spotlight sweep</h1><span class="pv-tag">Option 01 · splash</span>
  <div class="pv-group"><button data-set-frame="desktop">PC 1280</button><button data-set-frame="phone">Phone 412</button></div>
  <button id="pv-replay">Replay</button>
  <label><input type="checkbox" id="pv-reduced"> Reduced motion</label>
  <label><input type="checkbox" id="pv-hold"> Hold final frame</label>
  <span class="pv-spacer"></span><a href="banner.html">Banner →</a><a href="../index.html">All options</a>
</div>
<div class="pv-stage"><div class="pv-frame" id="frame"><img class="pv-app" alt=""><div id="mount"></div></div></div>
<p class="pv-note">Click or press any key inside the frame to dismiss early. The screenshot behind is a fictional test fixture of the current app.</p>
<template id="splash-tpl">
<div class="wl-splash" aria-hidden="true">
  <div class="wl-splash__layer wl-splash__dim"><div class="wl-splash__wall"></div><span class="wl-splash__word">Watchlist</span></div>
  <div class="wl-splash__layer wl-splash__lit"><div class="wl-splash__wall"></div><span class="wl-splash__word">Watchlist</span></div>
  <div class="wl-splash__layer wl-splash__final"><span class="wl-splash__word">Watchlist</span></div>
  <i class="wl-splash__tick"></i><i class="wl-splash__tick"></i><i class="wl-splash__tick"></i><i class="wl-splash__tick"></i>
</div>
</template>
<script src="../preview/harness.js"></script>
