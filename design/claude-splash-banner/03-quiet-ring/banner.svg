<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 200" preserveAspectRatio="xMinYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#9fc4ff" stroke-opacity=".06"></path></pattern>
    <linearGradient id="hz" x1="0" x2="1">
      <stop offset="0" stop-color="#8dd9ff" stop-opacity=".2"></stop>
      <stop offset=".12" stop-color="#8dd9ff" stop-opacity=".9"></stop>
      <stop offset=".5" stop-color="#8dd9ff" stop-opacity=".25"></stop>
      <stop offset="1" stop-color="#8dd9ff" stop-opacity="0"></stop>
    </linearGradient>
    <radialGradient id="glow" cx="240" cy="160" r="520" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 160) scale(1 .3) translate(-240 -160)">
      <stop offset="0" stop-color="#1d3052" stop-opacity=".9"></stop>
      <stop offset="1" stop-color="#05070d" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="tickFade" x1="0" x2="1"><stop offset="0" stop-color="#fff"></stop><stop offset=".55" stop-color="#000"></stop></linearGradient>
    <mask id="tm"><rect width="1920" height="200" fill="url(#tickFade)"></rect></mask>
    <pattern id="ticks" width="24" height="10" patternUnits="userSpaceOnUse"><rect width="1" height="6" fill="#8dd9ff" fill-opacity=".45"></rect></pattern>
  </defs>
  <rect width="1920" height="200" fill="#05070d"></rect>
  <rect width="1920" height="200" fill="url(#grid)"></rect>
  <ellipse cx="240" cy="160" rx="720" ry="170" fill="url(#glow)"></ellipse>
  <rect y="163" width="1920" height="6" fill="url(#ticks)" mask="url(#tm)"></rect>
  <rect y="160" width="1920" height="1" fill="url(#hz)"></rect>
  <rect y="158" width="1920" height="5" fill="url(#hz)" opacity=".18"></rect>
  <rect y="199" width="1920" height="1" fill="#2c3b54"></rect>
</svg>