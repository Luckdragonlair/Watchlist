<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Instrument Serif";src:url("{{FONT_DATA}}")}
html,body{margin:0;background:transparent}#stage{position:relative;overflow:hidden}#variants{display:none}
#stage span{color:#ffe79b!important;background:linear-gradient(160deg,#ffdf72 0%,#fff9d1 17%,#f6ca52 32%,#bb7d14 43%,#fffde8 48%,#ffe482 54%,#e8ad30 70%,#fff1b2 85%,#ffd85b 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none!important;filter:drop-shadow(0 1px 0 #775014) drop-shadow(0 0 4px #ffc84b45)}
</style></head><body><div id="stage"></div><div id="variants"><div style="display:flex;align-items:flex-end;gap:20px">
<div style="width:120px;height:120px;border-radius:28px;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%, #1c2d52, #070a14 75%);box-shadow:inset 0 0 0 1px rgba(150,185,240,.22),0 10px 30px rgba(0,0,0,.5)">
<div style="position:absolute;inset:14px;border-radius:50%;border:1.5px solid oklch(0.82 0.1 230 / .7);border-top-color:transparent;border-bottom-color:transparent;transform:rotate(-20deg)"></div>
<div style="position:absolute;inset:22px;border-radius:50%;background:repeating-conic-gradient(oklch(0.82 0.1 230 / .5) 0 1.5deg, transparent 1.5deg 12deg);-webkit-mask:radial-gradient(circle, transparent 69%, #000 70%, #000 75%, transparent 76%);mask:radial-gradient(circle, transparent 69%, #000 70%, #000 75%, transparent 76%)"></div>
<span style="font:400 64px/1 'Instrument Serif',serif;color:#f1f6ff;margin-top:6px;text-shadow:0 0 20px oklch(0.75 0.12 240 / .8)">W</span>
</div>
<div style="width:56px;height:56px;border-radius:14px;position:relative;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%, #1c2d52, #070a14 75%);box-shadow:inset 0 0 0 1px rgba(150,185,240,.22)"><div style="position:absolute;inset:7px;border-radius:50%;border:1px solid oklch(0.82 0.1 230 / .7);border-top-color:transparent;border-bottom-color:transparent;transform:rotate(-20deg)"></div><span style="font:400 31px/1 'Instrument Serif',serif;color:#f1f6ff;margin-top:3px">W</span></div>
<div style="width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%, #1c2d52, #070a14 75%);box-shadow:inset 0 0 0 1px rgba(150,185,240,.25)"><span style="font:400 21px/1 'Instrument Serif',serif;color:#f1f6ff;margin-top:2px">W</span></div>
</div>
</div></body></html>
